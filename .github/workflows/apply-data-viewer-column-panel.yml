name: Apply data viewer column panel integration

on:
  push:
    branches:
      - feature/data-viewer-column-panel
    paths:
      - .github/workflows/apply-data-viewer-column-panel.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/data-viewer-column-panel
          fetch-depth: 0

      - name: Patch session.ts
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/session.ts')
          s = path.read_text()

          def once(old, new, name):
              global s
              if s.count(old) != 1:
                  raise RuntimeError(f'{name}: expected exactly one match, found {s.count(old)}')
              s = s.replace(old, new, 1)

          once(
              "import { showWebView } from './webViewer';\n",
              "import { showWebView } from './webViewer';\nimport { getDataViewerColumnPanelHtml, getDataViewerColumnPanelScript, getDataViewerColumnPanelStyle } from './dataViewerColumnPanel';\n",
              'import'
          )

          once(
              "    .dataview-na {\n        color: var(--vscode-descriptionForeground);\n        font-style: italic;\n        opacity: 0.75;\n    }\n    </style>\n    <script src=\"${String(webview.asWebviewUri(Uri.file(path.join(resDir, 'ag-grid-community.min.noStyle.js'))))}\"></script>",
              "    .dataview-na {\n        color: var(--vscode-descriptionForeground);\n        font-style: italic;\n        opacity: 0.75;\n    }\n    ${getDataViewerColumnPanelStyle()}\n    </style>\n    <script src=\"${String(webview.asWebviewUri(Uri.file(path.join(resDir, 'ag-grid-community.min.noStyle.js'))))}\"></script>",
              'style'
          )

          once(
              "    let gridApi;\n    let activeFetches = 0;",
              "    let gridApi;\n    ${getDataViewerColumnPanelScript()}\n    let activeFetches = 0;",
              'script'
          )

          once(
              "            onPaginationChanged: updateScrollPosition,",
              "            onColumnMoved: syncColumnPanelFromGrid,\n            onColumnVisible: syncColumnPanelFromGrid,\n            onPaginationChanged: updateScrollPosition,",
              'grid events'
          )

          once(
              "            gridApi = window.agGrid.createGrid(gridDiv, gridOptions);\n            console.log('[dataview] Grid created successfully');",
              "            gridApi = window.agGrid.createGrid(gridDiv, gridOptions);\n            initializeColumnPanel();\n            console.log('[dataview] Grid created successfully');",
              'initialization'
          )

          once(
              "        <div id=\"myGrid\" style=\"height: 100%;\"></div>\n        <div id=\"scrollPosition\" role=\"status\" aria-live=\"polite\"></div>",
              "        <div id=\"myGrid\" style=\"height: 100%;\"></div>\n        ${getDataViewerColumnPanelHtml()}\n        <div id=\"scrollPosition\" role=\"status\" aria-live=\"polite\"></div>",
              'html'
          )

          path.write_text(s)

      - name: Commit direct integration
        run: |
          rm .github/workflows/apply-data-viewer-column-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session.ts .github/workflows/apply-data-viewer-column-panel.yml
          git commit -m "Wire data viewer column panel [skip ci]"
          git push origin feature/data-viewer-column-panel
